visible_hostname pitaya-egress
http_port 3128
pid_filename /run/squid.pid
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

acl CONNECT method CONNECT
acl tls_port port 443
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl private_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::1/128 fc00::/7 fe80::/10

http_access deny !CONNECT
http_access deny !tls_port
http_access deny private_destination
http_access allow allowed_domains
http_access deny all
